<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sriram Mythili Sekar – Name Card</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Name Card">
  <meta name="theme-color" content="#0f62fe">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <img class="photo" src="assets/photo.png" alt="Portrait of Sriram Mythili Sekar">
    <h1 id="name">Sriram Mythili Sekar</h1>
    <p class="company">IBM</p>

    <ul class="contacts">
      <li><a id="phone" href="tel:+6584547212"><span class="label">Phone</span>+65 8454 7212</a></li>
      <li><a id="email" href="mailto:sriram.mythili.sekar@ibm.com"><span class="label">Email</span>sriram.mythili.sekar@ibm.com</a></li>
      <li><a id="linkedin" href="https://www.linkedin.com/in/mythili-sekar-sriram/" target="_blank" rel="noopener"><span class="label">LinkedIn</span>mythili-sekar-sriram</a></li>
    </ul>

    <div id="qr" class="qr" hidden>
      <img src="assets/qr.svg" alt="QR code containing Sriram's contact details" width="220" height="220">
      <p>Scan with a phone camera to add my contact</p>
    </div>

    <div class="actions">
      <button id="show-qr" type="button" class="secondary" aria-expanded="false" aria-controls="qr">Show QR Code</button>
      <button id="save" type="button">Save to Contacts</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
